[project]
name = "backend"
version = "0.1.0"
description = "Wagtail CMS backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django==5.2.18",
    "wagtail==7.4.4",
    "psycopg[binary]==3.3.6",
    "django-environ==0.14.0",
    "django-storages[boto3]==1.14.6",
    "django-axes==8.3.1",
    "django-cors-headers==4.9.0",
    "wagtail-headless-preview==0.9.0",
    "nh3==0.3.7",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "pytest==9.2.0",
    "pytest-django==4.14.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"cms_project/settings/dev.py" = ["F403", "F405"]
"cms_project/settings/production.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cms_project.settings.dev"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
